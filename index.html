<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">

  <title>Skill Mind AI</title>

  <style>
    :root {
      --bg: #071426;
      --blue: #1677ff;
      --cyan: #22c7f2;
      --white: #ffffff;
      --muted: #a9bad0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 35%,
        #102b4c 0%, #071426 60%);
      color: var(--white);
    }

    a {
      text-decoration: none;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 20px 5%;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .navbar {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1677ff, #22c7f2);
      font-size: 23px;
    }

    .brand span:last-child {
      color: var(--cyan);
    }

    .language {
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 9px;
      background: #102541;
      color: white;
      outline: none;
    }

    .language option {
      background: #102541;
    }

    /* MAIN */

    main {
      flex: 1;
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 65px 20px 75px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .main-title {
      font-size: clamp(32px, 6vw, 49px);
      font-weight: 850;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .main-title span {
      background: linear-gradient(90deg, #3188ff, #28d0ef);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 42px;
    }

    /* HUB BUTTONS */

    .hub-container {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .hub-button {
      width: 100%;
      min-height: 105px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.15);
      background: linear-gradient(110deg, #1268ed, #168efb);
      color: white;
      box-shadow: 0 10px 30px rgba(22,119,255,.20);
      transition: .25s ease;
    }

    .hub-button:hover {
      transform: translateY(-4px);
      background: linear-gradient(110deg, #287fff, #20a9ff);
      box-shadow: 0 14px 35px rgba(22,119,255,.35);
    }

    .hub-icon {
      font-size: 35px;
    }

    .hub-text {
      text-align: left;
    }

    .hub-text h2 {
      font-size: 23px;
      margin-bottom: 4px;
    }

    .hub-text p {
      font-size: 13px;
      color: #e0edff;
    }

    .arrow {
      font-size: 24px;
      margin-left: auto;
    }

    /* GET STARTED */

    .get-started {
      margin-top: 32px;
      padding: 13px 30px;
      min-width: 190px;
      border: 1px solid rgba(34,199,242,.5);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      background: rgba(34,199,242,.08);
      transition: .2s;
    }

    .get-started:hover {
      background: rgba(34,199,242,.18);
      transform: translateY(-2px);
    }

    /* FOOTER */

    footer {
      width: 100%;
      padding: 20px 15px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(3,12,25,.55);
      color: #91a6c0;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      header {
        padding: 15px 4%;
      }

      .brand {
        font-size: 17px;
      }

      .brand-icon {
        width: 35px;
        height: 35px;
      }

      .language {
        padding: 8px;
        font-size: 12px;
      }

      main {
        padding-top: 55px;
        padding-bottom: 60px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 32px;
      }

      .hub-button {
        min-height: 92px;
        padding: 16px;
        gap: 12px;
      }

      .hub-icon {
        font-size: 30px;
      }

      .hub-text h2 {
        font-size: 20px;
      }

      .hub-text p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="navbar">

      <a href="index.html" class="brand">
        <div class="brand-icon">✦</div>
        <div>Skill Mind <span>AI</span></div>
      </a>

      <select class="language" id="language">
        <option value="bn">বাংলা</option>
        <option value="en">English</option>
      </select>

    </div>
  </header>

  <!-- MAIN HOME PAGE -->
  <main>

    <h1 class="main-title">
      <span>Skill Mind AI</span>
    </h1>

    <p class="subtitle" data-bn="শিখুন দক্ষতা। গড়ুন নিজের ভবিষ্যৎ।"
       data-en="Learn Skills. Build Your Future.">
      শিখুন দক্ষতা। গড়ুন নিজের ভবিষ্যৎ।
    </p>

    <div class="hub-container">

      <!-- LEARNING HUB -->
      <a href="learning.html" class="hub-button">

        <div class="hub-icon">🎓</div>

        <div class="hub-text">
          <h2>Learning Hub</h2>
          <p data-bn="নতুন দক্ষতা শেখা শুরু করুন"
             data-en="Start learning new skills">
            নতুন দক্ষতা শেখা শুরু করুন
          </p>
        </div>

        <div class="arrow">→</div>

      </a>

      <!-- EARNING HUB -->
      <a href="earning.html" class="hub-button">

        <div class="hub-icon">💼</div>

        <div class="hub-text">
          <h2>Earning Hub</h2>
          <p data-bn="কাজের সুযোগ খুঁজে নিন"
             data-en="Explore work opportunities">
            কাজের সুযোগ খুঁজে নিন
          </p>
        </div>

        <div class="arrow">→</div>

      </a>

    </div>

    <!-- GET STARTED -->
    <a href="onboarding.html" class="get-started"
       data-bn="Get Started →"
       data-en="Get Started →">
      Get Started →
    </a>

  </main>

  <!-- FOOTER -->
  <footer>
    © <span id="year"></span> Skill Mind AI.
    <span id="footerText">সর্বস্বত্ব সংরক্ষিত।</span>
  </footer>

  <script>
    const languageSelect = document.getElementById("language");

    function changeLanguage(lang) {
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-bn]").forEach(element => {
        element.textContent = element.getAttribute(
          lang === "en" ? "data-en" : "data-bn"
        );
      });

      document.getElementById("footerText").textContent =
        lang === "en" ? "All rights reserved." : "সর্বস্বত্ব সংরক্ষিত।";

      try {
        localStorage.setItem("skillMindLanguage", lang);
      } catch (error) {}
    }

    languageSelect.addEventListener("change", function() {
      changeLanguage(this.value);
    });

    let savedLanguage = "bn";

    try {
      savedLanguage = localStorage.getItem("skillMindLanguage") || "bn";
    } catch (error) {}

    languageSelect.value = savedLanguage;
    changeLanguage(savedLanguage);

    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
