<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>Skill Mind AI</title>  <style>
    :root {
      --bg: #071426;
      --blue: #1677ff;
      --cyan: #22c7f2;
      --white: #ffffff;
      --muted: #a9bad0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 50% 35%, #102b4c 0%, #071426 60%);
      color: var(--white);
    }

    a {
      text-decoration: none;
    }

    header {
      width: 100%;
      padding: 20px 5%;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .navbar {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1677ff, #22c7f2);
      font-size: 23px;
    }

    .brand span:last-child {
      color: var(--cyan);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language {
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 9px;
      background: #102541;
      color: white;
      outline: none;
    }

    .language option {
      background: #102541;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 65px 20px 75px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .main-title {
      font-size: clamp(32px, 6vw, 49px);
      font-weight: 850;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .main-title span {
      background: linear-gradient(90deg, #3188ff, #28d0ef);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 35px;
      line-height: 1.7;
    }

    .hub-container {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .hub-button {
      width: 100%;
      min-height: 105px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.15);
      background: linear-gradient(110deg, #1268ed, #168efb);
      color: white;
      box-shadow: 0 10px 30px rgba(22,119,255,.20);
      transition: .25s ease;
    }

    .hub-button:hover {
      transform: translateY(-4px);
      background: linear-gradient(110deg, #287fff, #20a9ff);
      box-shadow: 0 14px 35px rgba(22,119,255,.35);
    }

    .hub-icon {
      font-size: 35px;
    }

    .hub-text {
      text-align: left;
    }

    .hub-text h2 {
      font-size: 23px;
      margin-bottom: 4px;
    }

    .hub-text p {
      font-size: 13px;
      color: #e0edff;
      line-height: 1.5;
    }

    .arrow {
      font-size: 24px;
      margin-left: auto;
    }

    .auth-area {
      width: 100%;
      max-width: 520px;
      margin-top: 30px;
    }

    .auth-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .auth-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 1px solid rgba(34,199,242,.5);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      background: rgba(34,199,242,.08);
      transition: .2s;
    }

    .auth-button:hover {
      transform: translateY(-2px);
      background: rgba(34,199,242,.18);
    }

    .primary-button {
      background: linear-gradient(110deg, #1268ed, #168efb);
      border-color: #1677ff;
    }

    .primary-button:hover {
      background: linear-gradient(110deg, #287fff, #20a9ff);
    }

    .auth-status {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    footer {
      width: 100%;
      padding: 20px 15px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(3,12,25,.55);
      color: #91a6c0;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      header {
        padding: 15px 4%;
      }

      .brand {
        font-size: 17px;
      }

      .brand-icon {
        width: 35px;
        height: 35px;
      }

      .header-right {
        gap: 6px;
      }

      .language {
        padding: 8px;
        font-size: 12px;
      }

      main {
        padding: 50px 16px 55px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 30px;
      }

      .hub-button {
        min-height: 92px;
        padding: 16px;
        gap: 12px;
      }

      .hub-icon {
        font-size: 30px;
      }

      .hub-text h2 {
        font-size: 20px;
      }

      .hub-text p {
        font-size: 12px;
      }

      .auth-buttons {
        flex-direction: column;
      }

      .auth-button {
        width: 100%;
      }
    }
  </style></head><body>  <header>
    <div class="navbar">
      <a href="index.html" class="brand">
        <div class="brand-icon">✦</div>
        <div>Skill Mind <span>AI</span></div>
      </a>  <div class="header-right">
    <select class="language" id="language" aria-label="Select language">
      <option value="bn">বাংলা</option>
      <option value="en">English</option>
    </select>
  </div>
</div>

  </header>  <main>
    <h1 class="main-title">
      <span>Skill Mind AI</span>
    </h1><p class="subtitle"
   data-bn="শিখুন দক্ষতা। গড়ুন নিজের ভবিষ্যৎ।"
   data-en="Learn Skills. Build Your Future.">
  শিখুন দক্ষতা। গড়ুন নিজের ভবিষ্যৎ।
</p>

<div class="hub-container">
  <a href="learning.html" class="hub-button">
    <div class="hub-icon">🎓</div>
    <div class="hub-text">
      <h2>Learning Hub</h2>
      <p data-bn="নতুন দক্ষতা শেখা শুরু করুন"
         data-en="Start learning new skills">
        নতুন দক্ষতা শেখা শুরু করুন
      </p>
    </div>
    <div class="arrow">→</div>
  </a>

  <a href="earning.html" class="hub-button">
    <div class="hub-icon">💼</div>
    <div class="hub-text">
      <h2>Earning Hub</h2>
      <p data-bn="কাজের সুযোগ খুঁজে নিন"
         data-en="Explore work opportunities">
        কাজের সুযোগ খুঁজে নিন
      </p>
    </div>
    <div class="arrow">→</div>
  </a>
</div>

<section class="auth-area" aria-label="Account options">

  <div id="guestButtons" class="auth-buttons hidden">
    <a href="login.html" class="auth-button primary-button"
       data-bn="লগইন করুন →"
       data-en="Login →">
      লগইন করুন →
    </a>

    <a href="register.html" class="auth-button"
       data-bn="নতুন অ্যাকাউন্ট খুলুন →"
       data-en="Create Account →">
      নতুন অ্যাকাউন্ট খুলুন →
    </a>
  </div>

  <div id="userButtons" class="auth-buttons hidden">
    <a href="dashboard.html" class="auth-button primary-button"
       data-bn="আমার Dashboard →"
       data-en="My Dashboard →">
      আমার Dashboard →
    </a>

    <button id="logoutButton" type="button" class="auth-button"
            data-bn="লগআউট"
            data-en="Logout">
      লগআউট
    </button>
  </div>

  <p id="authStatus" class="auth-status"
     data-bn="আপনার অ্যাকাউন্টের অবস্থা যাচাই করা হচ্ছে..."
     data-en="Checking your account status...">
    আপনার অ্যাকাউন্টের অবস্থা যাচাই করা হচ্ছে...
  </p>
</section>

  </main>  <footer>
    © <span id="year"></span> Skill Mind AI.
    <span id="footerText">সর্বস্বত্ব সংরক্ষিত।</span>
  </footer>  <script>
    const languageSelect = document.getElementById("language");

    function changeLanguage(lang) {
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-bn]").forEach(element => {
        const translatedText = element.getAttribute(
          lang === "en" ? "data-en" : "data-bn"
        );

        if (translatedText !== null) {
          element.textContent = translatedText;
        }
      });

      document.getElementById("footerText").textContent =
        lang === "en" ? "All rights reserved." : "সর্বস্বত্ব সংরক্ষিত।";

      try {
        localStorage.setItem("skillMindLanguage", lang);
      } catch (error) {}
    }

    languageSelect.addEventListener("change", function() {
      changeLanguage(this.value);
    });

    let savedLanguage = "bn";

    try {
      savedLanguage = localStorage.getItem("skillMindLanguage") || "bn";
    } catch (error) {}

    if (!["bn", "en"].includes(savedLanguage)) {
      savedLanguage = "bn";
    }

    languageSelect.value = savedLanguage;
    changeLanguage(savedLanguage);

    document.getElementById("year").textContent =
      new Date().getFullYear();

    /*
      IMPORTANT:
      Replace these two placeholders with the same Supabase
      Project URL and Publishable key used in login.html.
      Never put a Supabase secret/service-role key here.
    */
    const SUPABASE_URL = "https://twhkrlhxapoxszhvbmyw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_kSIkMW91GzI4H0TcWsVung_bKwCz8Ak";

    const guestButtons = document.getElementById("guestButtons");
    const userButtons = document.getElementById("userButtons");
    const authStatus = document.getElementById("authStatus");
    const logoutButton = document.getElementById("logoutButton");

    function showGuestButtons(message) {
      guestButtons.classList.remove("hidden");
      userButtons.classList.add("hidden");

      authStatus.textContent = message;
    }

    function showUserButtons() {
      guestButtons.classList.add("hidden");
      userButtons.classList.remove("hidden");

      authStatus.textContent =
        languageSelect.value === "en"
          ? "You are logged in."
          : "আপনি লগইন অবস্থায় আছেন।";
    }

    async function initializeAuth() {
      if (
        SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        showGuestButtons(
          "Supabase সেটিংস বসানো হয়নি। Login ও Register করতে পারবেন, তবে Dashboard অবস্থা যাচাই করতে সেটিংস প্রয়োজন।"
        );
        return;
      }

      try {
        const { createClient } =
          await import("https://esm.sh/@supabase/supabase-js@2");

        const supabase = createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await supabase.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session) {
          showUserButtons();
        } else {
          showGuestButtons(
            languageSelect.value === "en"
              ? "Login or create an account to get started."
              : "শুরু করতে লগইন করুন অথবা নতুন অ্যাকাউন্ট খুলুন।"
          );
        }

        supabase.auth.onAuthStateChange((_event, session) => {
          if (session) {
            showUserButtons();
          } else {
            showGuestButtons(
              languageSelect.value === "en"
                ? "Login or create an account to get started."
                : "শুরু করতে লগইন করুন অথবা নতুন অ্যাকাউন্ট খুলুন।"
            );
          }
        });

        logoutButton.addEventListener("click", async () => {
          logoutButton.disabled = true;

          const { error: logoutError } = await supabase.auth.signOut();

          logoutButton.disabled = false;

          if (logoutError) {
            alert(
              languageSelect.value === "en"
                ? "Logout failed. Please try again."
                : "লগআউট হয়নি। আবার চেষ্টা করুন।"
            );
          }
        });

      } catch (error) {
        console.error("Authentication error:", error);

        showGuestButtons(
          languageSelect.value === "en"
            ? "Account status could not be checked. You can still open Login or Register."
            : "অ্যাকাউন্টের অবস্থা যাচাই করা যায়নি। Login অথবা Register খুলে চেষ্টা করুন।"
        );
      }
    }

    initializeAuth();
  </script></body>
</html>
